name: Eta Ultra Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publish in order: a slower older build must never replace a newer latest release.
concurrency:
  group: eta-ultra-stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Lint and full unit-test report
    if: github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up build environment
        uses: ./.github/actions/setup-build
      - name: Run full checks
        run: ./gradlew --no-daemon --no-configuration-cache --continue :app:lintDebug :app:testDebugUnitTest
      - name: Require actual feature integration coverage
        run: python3 scripts/verify_feature_test_reports.py
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build-release:
    name: Build and verify signed Release APK
    if: github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up build environment
        uses: ./.github/actions/setup-build
      - name: Restore persistent release certificate
        env:
          KEYSTORE: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "::error::Release signing secrets are required. See .github/RELEASING.md."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/eta-ultra-release.p12"
          chmod 600 "$RUNNER_TEMP/eta-ultra-release.p12"
      - name: Check voice, screen context and update regressions
        run: >-
          ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest
          --tests '*EtaVoicePanelTouchTest'
          --tests '*EtaAssistantScreenContextTest'
          --tests '*AppUpdateCheckerTest'
          --tests '*EnhancementSettingsHistoryTest'
          --tests '*AppRouteSerializationTest'
          --tests 'io.github.mangi.eta.agent.voice.*'
          --tests 'io.github.mangi.eta.ui.voice.*'
          --tests 'io.github.mangi.eta.agent.quickactions.*'
          --tests 'io.github.mangi.eta.agent.device.*'
          --tests 'io.github.mangi.eta.agent.planning.*'
          --tests '*Approval*Test'
          --tests '*AgentChatQuickActionsTest'
          --tests '*AgentChatContinuationStartTest'
          --tests '*AssistantSessionRecoveryTest'
          --tests '*AssistantBindingTest'
          --tests '*UserMessage*Test'
          --tests '*MemoryReview*Test'
          --tests '*MemoryRecallProjectionTest'
          --tests '*SettingsSectionsTest'
          --tests '*QuickTileServiceTest'
          --tests 'io.github.mangi.eta.agent.knowledge.*'
          --tests '*SessionSampling*Test'
          --tests '*AgentMultiModelFanoutTest'
          --tests '*FanoutReadOnlyTest'
          --tests '*ExperienceReviewPolicyTest'
          --tests '*AgentRuntimeWireTest'
          --tests '*ConversationCheckpointIntegrityTest'
          --tests '*Xingchi*Test'
          --tests '*GatewayAccessFailureTest'
          --tests '*Nfc*Test'
          --tests '*AutomationRuleDryRun*Test'
      - name: Build optimized stable Release
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-ultra-release.p12
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.releaseRunNumber=$GITHUB_RUN_NUMBER" :app:assembleRelease
      - name: Verify signature and APK identity
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          [[ ${#apks[@]} -eq 1 ]] || { echo '::error::Expected one Release APK'; exit 1; }
          apk="${apks[0]}"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee release-signature.txt
          grep -qi '8450d3f45958265e3a7d9bec03cb45f4c843dffb7262d6661b0803949c815814' release-signature.txt
          python3 scripts/verify_assistant_release.py "$apk"
          "$tools/aapt" dump badging "$apk" > apk-identity.txt
          grep -q "name='io.github.mangi.eta'" apk-identity.txt
          grep -q "native-code: 'arm64-v8a'" apk-identity.txt
          if grep -q 'application-debuggable' apk-identity.txt; then
            echo '::error::Debuggable APK cannot be published as stable Release'; exit 1
          fi
          if grep -q -- '-debug\|-beta' app/build/outputs/apk/release/output-metadata.json; then
            echo '::error::Debug/Beta version suffix in stable APK'; exit 1
          fi
          "$tools/aapt" dump resources "$apk" > apk-resources.txt
          if grep -Eq ':(string|drawable|mipmap)/support_' apk-resources.txt; then
            echo '::error::Donation resources must not be included in the APK'; exit 1
          fi
      - name: Package public assets and generated release notes
        id: package
        run: |
          python3 scripts/release_metadata.py \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --output-dir dist --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cp release-signature.txt dist/release-signature.txt
      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-ultra-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/eta-ultra-release.p12"

  publish:
    name: Publish APK and synchronize download descriptions
    # Publication waits for both complete verification and the signed APK checks.
    needs: [verify, build-release]
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: eta-ultra-signed-release
          path: dist
      - name: Check asset checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish public stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun may update a release from this commit, never an unrelated tag.
            [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]]
            gh release upload "$RELEASE_TAG" dist/Eta-Ultra.apk dist/SHA256SUMS.txt dist/release-info.json dist/release-signature.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/Eta-Ultra.apk dist/SHA256SUMS.txt dist/release-info.json dist/release-signature.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Eta Ultra $RELEASE_VERSION" --notes-file dist/release-notes.md
          fi
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > published-release.json
          python3 - <<'PY'
          import json
          data = json.load(open('published-release.json'))
          assert not data['draft'] and not data['prerelease']
          assert {'Eta-Ultra.apk', 'SHA256SUMS.txt', 'release-info.json', 'release-signature.txt'} <= {a['name'] for a in data['assets']}
          PY
      - name: Refresh GitHub repository introduction
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.ETA_REPO_ADMIN_TOKEN }}
        run: python3 scripts/update_repo_metadata.py --release-info dist/release-info.json
      - name: Update Chinese and English README download panels
        env:
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
        run: |
          set -euo pipefail
          # A human push may have arrived while the APK was building. Update only README panels on current main.
          git checkout main
          git pull --ff-only origin main
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release_metadata', 'scripts/release_metadata.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          data = json.loads(Path('dist/release-info.json').read_text())
          base = 'https://github.com/' + __import__('os').environ['GITHUB_REPOSITORY']
          common = f"[`{data['commit'][:7]}`]({base}/commit/{data['commit']}) · versionCode `{data['versionCode']}`"
          for filename, text in [
              ('README.md', f"**最新正式版：[{data['version']}]({data['releaseUrl']})** · Android 13+ · ARM64\n\n[下载签名正式 APK]({data['latestDownloadUrl']}) · [历史版本]({base}/releases) · [本版更新说明]({data['releaseUrl']})\n\n来源提交：{common}\n\nSHA-256：`{data['sha256']}`"),
              ('README_EN.md', f"**Latest stable release: [{data['version']}]({data['releaseUrl']})** · Android 13+ · ARM64\n\n[Download signed Release APK]({data['latestDownloadUrl']}) · [All releases]({base}/releases) · [Release notes]({data['releaseUrl']})\n\nSource: {common}\n\nSHA-256: `{data['sha256']}`"),
          ]:
              module.update_panel(Path(filename), text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README_EN.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(release): update $RELEASE_TAG downloads [skip ci]"
            git push origin HEAD:main
          fi
